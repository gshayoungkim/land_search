<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 지번 토지 구획 시각화</title>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; background: #1a1a2e; color: #e0e0e0; overflow: hidden; }

  /* Tab nav */
  #tab-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; gap: 4px; padding: 6px;
    background: rgba(22,33,62,0.97); border-bottom: 1px solid #2a2a4a;
    backdrop-filter: blur(8px);
  }
  .tab-item {
    flex: 1; max-width: 240px; text-align: center;
    padding: 8px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    color: #64748b; text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .tab-item:hover { background: #1e2d4a; color: #a0b8d8; }
  .tab-item.active { background: #3d6b9e; color: #fff; }

  #app { display: flex; height: 100vh; width: 100vw; padding-top: 46px; }
  #map-wrap { flex: 1; position: relative; min-width: 0; height: calc(100vh - 46px); }
  #map-capture { position: relative; width: 100%; height: 100%; }
  #map { width: 100%; height: 100%; }
  #parcel-capture-layer {
    position: absolute;
    inset: 0;
    z-index: 5;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Search bar */
  #search-container {
    position: absolute; top: 14px; left: 14px; z-index: 10;
    display: flex; gap: 6px; width: 340px;
  }
  #search-input {
    flex: 1; padding: 9px 13px; border-radius: 8px; border: 1px solid #444;
    background: rgba(26,26,46,0.95); color: #e0e0e0; font-size: 13px;
    outline: none; backdrop-filter: blur(8px);
  }
  #search-input:focus { border-color: #6c8ebf; }
  #search-btn {
    padding: 9px 14px; border-radius: 8px; border: none;
    background: #3d6b9e; color: #fff; cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  #search-btn:hover { background: #4d7bb0; }

  /* Search results */
  #search-results {
    position: absolute; top: 48px; left: 14px; z-index: 11;
    width: 340px; background: rgba(26,26,46,0.97); border: 1px solid #444;
    border-radius: 8px; max-height: 240px; overflow-y: auto; display: none;
  }
  .search-result-item {
    padding: 9px 13px; cursor: pointer; border-bottom: 1px solid #333; line-height: 1.4;
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: #2a3a5a; }
  .search-result-item .addr { font-size: 12px; color: #aaa; }

  /* Map controls */
  #map-controls {
    position: absolute; top: 14px; right: 14px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  .map-ctrl-btn {
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid #444;
    background: rgba(26,26,46,0.95); color: #ccc; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; backdrop-filter: blur(8px); user-select: none;
  }
  .map-ctrl-btn:hover { background: #2a3a5a; color: #fff; }
  .map-ctrl-btn.active { background: #3d6b9e; color: #fff; border-color: #3d6b9e; }

  /* Zoom hint */
  #zoom-hint {
    position: absolute; bottom: 30px; left: 14px; z-index: 10;
    background: rgba(26,26,46,0.88); padding: 7px 12px; border-radius: 7px;
    font-size: 12px; color: #aaa; pointer-events: none; display: none;
  }

  /* Loading */
  #map-loading {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(26,26,46,0.9); padding: 8px 16px;
    border-radius: 7px; font-size: 12px; color: #a0b8d8; display: none;
    border: 1px solid #2a3a5a; pointer-events: none;
  }

  /* Toast */
  #toast {
    position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
    z-index: 20; background: rgba(40,40,60,0.95); color: #e0e0e0;
    padding: 9px 18px; border-radius: 8px; font-size: 13px;
    pointer-events: none; opacity: 0; transition: opacity 0.3s;
    white-space: nowrap; border: 1px solid #555;
  }
  #toast.show { opacity: 1; }

  /* Sidebar */
  #sidebar {
    width: 280px; background: #16213e; border-left: 1px solid #2a2a4a;
    display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
  }
  #sidebar-header { padding: 14px 14px 10px; border-bottom: 1px solid #2a2a4a; }
  #sidebar-header h2 { font-size: 14px; color: #a0b8d8; font-weight: 600; }
  #parcel-count { font-size: 11px; color: #666; margin-top: 2px; }

  #sidebar-actions {
    padding: 8px 14px; border-bottom: 1px solid #2a2a4a;
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .action-btn {
    flex: 1; min-width: 70px; padding: 6px 8px; border-radius: 6px; border: 1px solid #2a3a5a;
    background: #1e2d4a; color: #a0b8d8; cursor: pointer; font-size: 11px; text-align: center;
  }
  .action-btn:hover { background: #2a3a5a; }
  .action-btn.danger { border-color: #5a2a2a; background: #3a1a1a; color: #d08080; }
  .action-btn.danger:hover { background: #5a2a2a; }

  #parcel-list { flex: 1; overflow-y: auto; padding: 8px; }
  #parcel-list::-webkit-scrollbar { width: 5px; }
  #parcel-list::-webkit-scrollbar-track { background: transparent; }
  #parcel-list::-webkit-scrollbar-thumb { background: #2a3a5a; border-radius: 3px; }

  .parcel-card {
    background: #1e2d4a; border: 1px solid #2a3a5a; border-radius: 8px;
    margin-bottom: 8px; overflow: hidden;
  }
  .parcel-card.selected { border-color: #3d6b9e; }
  .parcel-card-header {
    padding: 8px 10px; display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .parcel-card-header:hover { background: #243450; }
  .parcel-checkbox { width: 14px; height: 14px; accent-color: #3d6b9e; cursor: pointer; flex-shrink: 0; }
  .parcel-color-preview { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #555; flex-shrink: 0; }
  .parcel-name { flex: 1; font-size: 12px; color: #c0d4e8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .parcel-toggle { color: #666; font-size: 11px; transition: transform 0.2s; }
  .parcel-toggle.open { transform: rotate(180deg); }

  .parcel-card-body { padding: 10px; border-top: 1px solid #2a3a5a; display: none; }
  .parcel-card-body.open { display: block; }

  .prop-row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
  .prop-label { width: 70px; font-size: 11px; color: #888; flex-shrink: 0; }
  .prop-row input[type="color"] {
    width: 36px; height: 24px; border: 1px solid #3a3a5a; border-radius: 4px;
    background: none; cursor: pointer; padding: 1px;
  }
  .prop-row input[type="range"] { flex: 1; accent-color: #3d6b9e; }
  .prop-value { width: 28px; font-size: 11px; color: #888; text-align: right; flex-shrink: 0; }

  .parcel-del-btn {
    width: 100%; padding: 5px; border-radius: 5px; border: 1px solid #5a2a2a;
    background: #3a1a1a; color: #d08080; cursor: pointer; font-size: 11px; margin-top: 2px;
  }
  .parcel-del-btn:hover { background: #5a2a2a; }

  #empty-state { text-align: center; padding: 40px 20px; color: #555; font-size: 12px; line-height: 1.8; }
</style>
</head>
<body>
<nav id="tab-nav">
  <a class="tab-item" href="/">🔍 토지이용계획 검색</a>
  <a class="tab-item active" href="/map.html">🗺️ 지적도 시각화</a>
</nav>
<div id="app">
  <div id="map-wrap">
    <div id="map-capture">
      <div id="map"></div>
      <canvas id="parcel-capture-layer"></canvas>
    </div>

    <div id="search-container">
      <input id="search-input" type="text" placeholder="주소 검색 (예: 인천시 계양구...)" autocomplete="off">
      <button id="search-btn">검색</button>
    </div>
    <div id="search-results"></div>

    <div id="map-controls">
      <button class="map-ctrl-btn" id="btn-satellite" title="항공사진">🛰</button>
      <button class="map-ctrl-btn" id="btn-zoom-in" title="확대">+</button>
      <button class="map-ctrl-btn" id="btn-zoom-out" title="축소">−</button>
    </div>

    <div id="zoom-hint">더 확대하면 지적도가 표시됩니다 (레벨: <span id="zoom-level"></span>)</div>
    <div id="map-loading">지적도 로딩 중...</div>
    <div id="toast"></div>
  </div>

  <div id="sidebar">
    <div id="sidebar-header">
      <h2>선택 필지</h2>
      <div id="parcel-count">0개 선택됨</div>
    </div>
    <div id="sidebar-actions">
      <button class="action-btn" id="btn-select-all">전체 선택</button>
      <button class="action-btn" id="btn-deselect-all">전체 해제</button>
      <button class="action-btn" id="btn-save">💾 저장</button>
      <button class="action-btn danger" id="btn-clear">초기화</button>
    </div>
    <div id="folder-bar" style="
      padding: 6px 14px; border-bottom: 1px solid #2a2a4a;
      display: flex; align-items: center; gap: 8px; min-height: 32px;
    ">
      <button class="action-btn" id="btn-pick-folder" style="flex: none; padding: 5px 10px; font-size: 11px;">📁 폴더 선택</button>
      <span id="folder-name" style="font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">미선택 (새 폴더를 생성하여 선택해주세요)</span>
    </div>
    <div id="parcel-list">
      <div id="empty-state">
        지도를 클릭하여<br>필지를 선택하세요<br><br>
        <small style="color:#444">카카오 지도 레벨 4 이하에서<br>지적도가 표시됩니다</small>
      </div>
    </div>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const state = {
  map: null,
  isSatellite: false,
  parcels: [],          // { id, pnu, label, paths, style, polygons[], checked, geoCoords[] }
  wfsPolygons: [],      // background viewport polygons
  loadingWfs: false,
  lastWfsBounds: null,
  dirHandle: null,      // File System Access API directory handle
};

// ─── Utils ────────────────────────────────────────────────────────────────────
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

function genId() { return Math.random().toString(36).slice(2, 9); }

// GeoJSON [lng, lat] coords → Kakao LatLng array
function geoRingToKakao(ring) {
  return ring.map(([lng, lat]) => new kakao.maps.LatLng(lat, lng));
}

// GeoJSON Feature geometry → array of LatLng arrays (handles Polygon + MultiPolygon)
function geometryToKakaoPaths(geometry) {
  if (geometry.type === 'Polygon') {
    return [geoRingToKakao(geometry.coordinates[0])];
  }
  if (geometry.type === 'MultiPolygon') {
    return geometry.coordinates.map(poly => geoRingToKakao(poly[0]));
  }
  return [];
}

// Bounding box of LatLng array
function pathsBounds(paths) {
  const flat = paths.flat();
  const lats = flat.map(p => p.getLat());
  const lngs = flat.map(p => p.getLng());
  return new kakao.maps.LatLngBounds(
    new kakao.maps.LatLng(Math.min(...lats), Math.min(...lngs)),
    new kakao.maps.LatLng(Math.max(...lats), Math.max(...lngs)),
  );
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
function showMapError(msg) {
  document.getElementById('map').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;color:#888;font-size:13px;gap:12px;padding:20px;text-align:center;">
      <div style="font-size:28px;">⚠️</div>
      <div style="color:#c0c0c0">${msg}</div>
    </div>`;
}

async function boot() {
  let kakaoAppKey = '';
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    kakaoAppKey = cfg.kakaoAppKey || '';
  } catch (e) {
    showMapError('서버 연결 실패<br><small>node proxy.js 가 실행 중인지 확인하세요</small>');
    return;
  }

  if (!kakaoAppKey) {
    showMapError('.env 에 KAKAO_APP_KEY 를 입력해주세요');
    return;
  }

  try {
    await loadKakaoSdk(kakaoAppKey);
  } catch (e) {
    console.error('Kakao SDK load error:', e);
    showMapError('카카오 지도 SDK 로드 실패<br><small>카카오 개발자 콘솔에서 http://localhost:8765 가 등록되었는지 확인하세요</small>');
    return;
  }

  initMap();
}

function loadKakaoSdk(appKey) {
  return new Promise((resolve, reject) => {
    // timeout: SDK loads but kakao.maps.load never fires when domain is not registered
    const timer = setTimeout(() => reject(new Error('SDK timeout — 도메인 미등록 의심')), 8000);
    const s = document.createElement('script');
    s.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${appKey}&libraries=services&autoload=false`;
    s.onload = () => kakao.maps.load(() => { clearTimeout(timer); resolve(); });
    s.onerror = (e) => { clearTimeout(timer); reject(e); };
    document.head.appendChild(s);
  });
}

// ─── Map Init ─────────────────────────────────────────────────────────────────
function initMap() {
  const container = document.getElementById('map');
  state.map = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(37.5665, 126.9780),
    level: 3,
  });

  resizeParcelLayer();
  window.addEventListener('resize', () => {
    resizeParcelLayer();
    scheduleParcelLayerRedraw();
  });

  // Zoom hint
  function updateZoomHint() {
    const level = state.map.getLevel();
    document.getElementById('zoom-level').textContent = level;
    document.getElementById('zoom-hint').style.display = level > 4 ? 'block' : 'none';
  }
  kakao.maps.event.addListener(state.map, 'zoom_changed', updateZoomHint);
  updateZoomHint();

  // Map click → parcel select
  kakao.maps.event.addListener(state.map, 'click', e => {
    onMapClick(e.latLng.getLat(), e.latLng.getLng());
  });

  // Reload WFS on move/zoom
  kakao.maps.event.addListener(state.map, 'idle', () => {
    if (state.map.getLevel() <= 4) loadWfsLayer();
    else clearWfsLayer();
    scheduleParcelLayerRedraw();
  });
  kakao.maps.event.addListener(state.map, 'bounds_changed', scheduleParcelLayerRedraw);

  if (state.map.getLevel() <= 4) loadWfsLayer();

  // Satellite toggle
  document.getElementById('btn-satellite').onclick = () => {
    state.isSatellite = !state.isSatellite;
    state.map.setMapTypeId(
      state.isSatellite ? kakao.maps.MapTypeId.HYBRID : kakao.maps.MapTypeId.ROADMAP
    );
    document.getElementById('btn-satellite').classList.toggle('active', state.isSatellite);
  };

  // Zoom controls
  document.getElementById('btn-zoom-in').onclick = () =>
    state.map.setLevel(state.map.getLevel() - 1, { animate: true });
  document.getElementById('btn-zoom-out').onclick = () =>
    state.map.setLevel(state.map.getLevel() + 1, { animate: true });
}

function resizeParcelLayer() {
  const canvas = document.getElementById('parcel-capture-layer');
  if (!canvas) return;

  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const width = Math.max(1, Math.round(rect.width * dpr));
  const height = Math.max(1, Math.round(rect.height * dpr));

  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
}

function drawParcelLayer() {
  const canvas = document.getElementById('parcel-capture-layer');
  if (!canvas || !state.map) return;

  resizeParcelLayer();

  const rect = canvas.getBoundingClientRect();
  const dpr = canvas.width / rect.width;
  const ctx = canvas.getContext('2d');
  const projection = state.map.getProjection();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  state.parcels.forEach(p => {
    if (!p.checked) return;

    p.paths.forEach(ring => {
      if (!ring.length) return;

      ctx.beginPath();

      const start = projection.containerPointFromCoords(ring[0]);
      ctx.moveTo(start.x, start.y);

      for (let i = 1; i < ring.length; i++) {
        const point = projection.containerPointFromCoords(ring[i]);
        ctx.lineTo(point.x, point.y);
      }

      ctx.closePath();

      ctx.save();
      ctx.fillStyle = p.style.fillColor || '#ff6b35';
      ctx.globalAlpha = p.style.fillOpacity !== undefined ? p.style.fillOpacity : 0.25;
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = p.style.strokeColor || '#ff6b35';
      ctx.lineWidth = p.style.strokeWidth || 2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();
    });
  });
}

function scheduleParcelLayerRedraw() {
  cancelAnimationFrame(scheduleParcelLayerRedraw._raf);
  scheduleParcelLayerRedraw._raf = requestAnimationFrame(drawParcelLayer);
}

// ─── WFS Viewport Layer ───────────────────────────────────────────────────────
async function loadWfsLayer() {
  if (state.loadingWfs) return;

  const bounds = state.map.getBounds();
  const sw = bounds.getSouthWest();
  const ne = bounds.getNorthEast();

  if (state.lastWfsBounds) {
    const prev = state.lastWfsBounds;
    const dx = Math.abs(ne.getLng() - prev.ne.getLng());
    const dy = Math.abs(ne.getLat() - prev.ne.getLat());
    const threshold = (ne.getLat() - sw.getLat()) * 0.3;
    if (dx < threshold && dy < threshold) return;
  }

  state.loadingWfs = true;
  state.lastWfsBounds = { sw, ne };
  document.getElementById('map-loading').style.display = 'block';

  // EPSG:4326 axis order is (lat, lon)
  const bbox = `${sw.getLat().toFixed(6)},${sw.getLng().toFixed(6)},${ne.getLat().toFixed(6)},${ne.getLng().toFixed(6)}`;

  try {
    const data = await wfsFetch('lp_pa_cbnd_bonbun', bbox);
    clearWfsLayer();
    (data?.features || []).forEach(feature => {
      geometryToKakaoPaths(feature.geometry).forEach(path => {
        const poly = new kakao.maps.Polygon({
          map: state.map,
          path,
          strokeWeight: 0.8,
          strokeColor: '#8888bb',
          strokeOpacity: 0.7,
          fillColor: '#4444aa',
          fillOpacity: 0.04,
          zIndex: 1,
        });
        // Forward click to parcel selector
        kakao.maps.event.addListener(poly, 'click', e => {
          onMapClick(e.latLng.getLat(), e.latLng.getLng());
        });
        state.wfsPolygons.push(poly);
      });
    });
  } catch (_) {
    // silent
  } finally {
    state.loadingWfs = false;
    document.getElementById('map-loading').style.display = 'none';
  }
}

function clearWfsLayer() {
  state.wfsPolygons.forEach(p => p.setMap(null));
  state.wfsPolygons = [];
  state.lastWfsBounds = null;
}

// ─── API Helpers ──────────────────────────────────────────────────────────────
async function wfsFetch(typename, bbox) {
  const url = `/api/wfs?typename=${encodeURIComponent(typename)}&bbox=${encodeURIComponent(bbox)}`;
  const r = await fetch(url);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || `WFS ${r.status}`);
  if (data.error) throw new Error(data.error);
  return data;
}

// ─── Map Click: select parcel ─────────────────────────────────────────────────
async function onMapClick(lat, lng) {
  const delta = 0.0002;
  // EPSG:4326 axis order is (lat, lon)
  const bbox = `${(lat - delta).toFixed(6)},${(lng - delta).toFixed(6)},${(lat + delta).toFixed(6)},${(lng + delta).toFixed(6)}`;

  document.getElementById('map-loading').style.display = 'block';
  try {
    let feature = null;

    const data = await wfsFetch('lp_pa_cbnd_bonbun', bbox);
    if (data?.features?.length > 0) {
      feature = data.features[0];
    } else {
      const data2 = await wfsFetch('lp_pa_cbnd_bubun', bbox);
      if (data2?.features?.length > 0) feature = data2.features[0];
    }

    if (!feature) {
      showToast('해당 위치의 지적 정보를 불러올 수 없습니다', 4000);
      return;
    }
    addParcelFeature(feature);
  } catch (err) {
    console.error('[WFS]', err);
    showToast('지적 조회 실패: ' + err.message, 4000);
  } finally {
    document.getElementById('map-loading').style.display = 'none';
  }
}

function addParcelFeature(feature) {
  const props = feature.properties || {};
  const pnu = props.PNU || props.pnu || props.A1 || JSON.stringify(feature.geometry).slice(0, 40);

  if (state.parcels.find(p => p.pnu === pnu)) {
    showToast('이미 선택된 필지입니다');
    return;
  }

  const paths = geometryToKakaoPaths(feature.geometry);
  if (!paths.length) return;

  const style = { strokeColor: '#ff6b35', strokeWidth: 2, fillColor: '#ff6b35', fillOpacity: 0.25 };
  const polygons = createKakaoPolygons(paths, style);

  const label = makeLabel(props);
  const id = genId();

  state.parcels.push({ id, pnu, label, paths, style, polygons, checked: true, feature });
  renderSidebar();
  scheduleParcelLayerRedraw();
  showToast(`필지 선택: ${label}`);
}

function createKakaoPolygons(paths, style) {
  return paths.map(path => new kakao.maps.Polygon({
    map: state.map,
    path,
    strokeWeight: style.strokeWidth,
    strokeColor: style.strokeColor,
    strokeOpacity: 0,
    fillColor: style.fillColor,
    fillOpacity: 0,
    zIndex: 10,
  }));
}

function makeLabel(props) {
  for (const k of ['JIBUN', 'jibun', 'A4', 'PNU', 'ADDR', 'addr']) {
    if (props[k]) return String(props[k]);
  }
  return Object.values(props).find(v => typeof v === 'string' && v.length > 0) || '알 수 없음';
}

function applyStyleToPolygons(polygons, style) {
  polygons.forEach(poly => poly.setOptions({
    strokeWeight: style.strokeWidth,
    strokeColor: style.strokeColor,
    strokeOpacity: 0,
    fillColor: style.fillColor,
    fillOpacity: 0,
  }));
}

function removeParcel(id) {
  const idx = state.parcels.findIndex(p => p.id === id);
  if (idx === -1) return;
  const [p] = state.parcels.splice(idx, 1);
  p.polygons.forEach(poly => poly.setMap(null));
  renderSidebar();
  scheduleParcelLayerRedraw();
}

// ─── Sidebar ──────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('parcel-list');
  document.getElementById('parcel-count').textContent = `${state.parcels.length}개 선택됨`;

  if (!state.parcels.length) {
    list.innerHTML = `<div id="empty-state">지도를 클릭하여<br>필지를 선택하세요<br><br><small style="color:#444">카카오 지도 레벨 4 이하에서<br>지적도가 표시됩니다</small></div>`;
    return;
  }

  list.innerHTML = state.parcels.map(p => cardHTML(p)).join('');

  state.parcels.forEach(p => {
    const card = document.getElementById(`card-${p.id}`);
    const body = card.querySelector('.parcel-card-body');
    const toggle = card.querySelector('.parcel-toggle');
    const cb = card.querySelector('.parcel-checkbox');

    card.querySelector('.parcel-card-header').addEventListener('click', e => {
      if (e.target === cb) return;
      const open = body.classList.toggle('open');
      toggle.classList.toggle('open', open);
    });

    card.querySelector('.parcel-card-header').addEventListener('dblclick', () => {
      const bounds = pathsBounds(p.paths);
      state.map.setBounds(bounds, 50, 50, 50, 50);
    });

    cb.addEventListener('change', () => {
      p.checked = cb.checked;
      card.classList.toggle('selected', p.checked);
      p.polygons.forEach(poly => poly.setMap(p.checked ? state.map : null));
      scheduleParcelLayerRedraw();
    });

    bindProp(card, 'stroke-color', val => {
      p.style.strokeColor = val;
      card.querySelector('.parcel-color-preview').style.background = val;
      applyStyleToPolygons(p.polygons, p.style);
      scheduleParcelLayerRedraw();
    });
    bindProp(card, 'stroke-width', val => {
      p.style.strokeWidth = parseFloat(val);
      card.querySelector('[data-val="stroke-width"]').textContent = val + 'px';
      applyStyleToPolygons(p.polygons, p.style);
      scheduleParcelLayerRedraw();
    });
    bindProp(card, 'fill-color', val => {
      p.style.fillColor = val;
      applyStyleToPolygons(p.polygons, p.style);
      scheduleParcelLayerRedraw();
    });
    bindProp(card, 'fill-opacity', val => {
      p.style.fillOpacity = parseFloat(val);
      card.querySelector('[data-val="fill-opacity"]').textContent = parseFloat(val).toFixed(2);
      applyStyleToPolygons(p.polygons, p.style);
      scheduleParcelLayerRedraw();
    });

    card.querySelector('.parcel-del-btn').addEventListener('click', () => removeParcel(p.id));
  });
}

function bindProp(card, name, handler) {
  const el = card.querySelector(`[data-prop="${name}"]`);
  if (el) el.addEventListener('input', () => handler(el.value));
}

function cardHTML(p) {
  const s = p.style;
  return `
  <div class="parcel-card ${p.checked ? 'selected' : ''}" id="card-${p.id}">
    <div class="parcel-card-header">
      <input type="checkbox" class="parcel-checkbox" ${p.checked ? 'checked' : ''}>
      <div class="parcel-color-preview" style="background:${s.strokeColor}"></div>
      <span class="parcel-name" title="${p.label}">${p.label}</span>
      <span class="parcel-toggle">▼</span>
    </div>
    <div class="parcel-card-body">
      <div class="prop-row">
        <span class="prop-label">테두리 색</span>
        <input type="color" data-prop="stroke-color" value="${s.strokeColor}">
      </div>
      <div class="prop-row">
        <span class="prop-label">테두리 두께</span>
        <input type="range" data-prop="stroke-width" min="1" max="8" step="0.5" value="${s.strokeWidth}">
        <span class="prop-value" data-val="stroke-width">${s.strokeWidth}px</span>
      </div>
      <div class="prop-row">
        <span class="prop-label">채우기 색</span>
        <input type="color" data-prop="fill-color" value="${s.fillColor}">
      </div>
      <div class="prop-row">
        <span class="prop-label">채우기 투명도</span>
        <input type="range" data-prop="fill-opacity" min="0" max="0.8" step="0.05" value="${s.fillOpacity}">
        <span class="prop-value" data-val="fill-opacity">${s.fillOpacity.toFixed(2)}</span>
      </div>
      <button class="parcel-del-btn">삭제</button>
    </div>
  </div>`;
}

// ─── Sidebar Actions ──────────────────────────────────────────────────────────
document.getElementById('btn-select-all').onclick = () => {
  state.parcels.forEach(p => {
    p.checked = true;
    p.polygons.forEach(poly => poly.setMap(state.map));
  });
  renderSidebar();
  scheduleParcelLayerRedraw();
};

document.getElementById('btn-deselect-all').onclick = () => {
  state.parcels.forEach(p => {
    p.checked = false;
    p.polygons.forEach(poly => poly.setMap(null));
  });
  renderSidebar();
  scheduleParcelLayerRedraw();
};

document.getElementById('btn-clear').onclick = () => {
  if (!state.parcels.length || !confirm('모든 선택 필지를 초기화하시겠습니까?')) return;
  state.parcels.forEach(p => p.polygons.forEach(poly => poly.setMap(null)));
  state.parcels = [];
  renderSidebar();
  scheduleParcelLayerRedraw();
};

document.getElementById('btn-save').onclick = async () => {
  showToast('지적도 캡처 중...');
  try {
    drawParcelLayer();

    const canvas = await html2canvas(document.getElementById('map-capture'), {
      useCORS: false,
      proxy: '/api/proxy',
      scale: 2,
      logging: false,
    });

    const filename = `지적도_${new Date().toISOString().slice(0, 10)}.png`;

    if (state.dirHandle) {
      canvas.toBlob(async (blob) => {
        try {
          await writeFileToDir(state.dirHandle, filename, blob);
          showToast(`지적도 이미지 저장 완료 → ${state.dirHandle.name}/${filename}`);
        } catch (e) {
          if (e.name === 'NotAllowedError') {
            alert('⚠️ 폴더 쓰기 권한이 없습니다.\n\n브라우저 상단에 "파일 수정 허용" 창이 열려있는지 확인하시고 [변경사항 저장 허용]을 클릭해주시거나, 폴더 선택을 다시 해주세요.');
          } else {
            showToast('폴더 저장 실패: ' + e.message);
          }
        }
      }, 'image/png');
    } else {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('지적도 이미지 저장 완료 (다운로드 폴더)');
    }
  } catch (e) {
    showToast('저장 실패: ' + e.message);
  }
};

// ─── Folder Picker ────────────────────────────────────────────────────────────
document.getElementById('btn-pick-folder').onclick = async () => {
  if (!window.showDirectoryPicker) {
    showToast('이 브라우저는 폴더 선택을 지원하지 않습니다 (Chrome/Edge 권장)');
    return;
  }
  try {
    state.dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    document.getElementById('folder-name').textContent = '📂 ' + state.dirHandle.name;
    document.getElementById('folder-name').style.color = '#6dba8d';
    showToast(`폴더 선택됨: ${state.dirHandle.name}`);
  } catch (e) {
    if (e.name === 'AbortError') return;
    console.error('Directory picker error:', e);
    if (e.name === 'SecurityError' || e.name === 'NotAllowedError' || e.message.includes('system') || e.message.includes('permission')) {
      alert(`⚠️ [폴더 선택 제한 안내]\n\n크롬(Chrome) 및 웨일 등 브라우저 보안 정책에 따라 바탕화면, 다운로드 폴더, 드라이브 루트(C:\\, D:\\) 등 "시스템 주요 폴더"는 직접 선택하여 저장할 수 없습니다.\n\n[해결 방법]\n1. '내 문서'나 다른 일반 폴더 내에 새 폴더(예: '토지지도저장')를 만들어 해당 폴더를 선택해주세요.\n2. 혹은 바탕화면 안에 새로 생성한 폴더를 선택하는 것은 가능합니다.`);
    } else {
      showToast('폴더 선택 실패: ' + e.message);
    }
  }
};

async function writeFileToDir(handle, filename, blob) {
  const fileHandle = await handle.getFileHandle(filename, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(blob);
  await writable.close();
}

// ─── Address Search (Kakao Geocoder) ─────────────────────────────────────────
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

document.getElementById('search-btn').onclick = doSearch;
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.addEventListener('click', e => {
  if (!e.target.closest('#search-container') && !e.target.closest('#search-results')) {
    searchResults.style.display = 'none';
  }
});

function doSearch() {
  const query = searchInput.value.trim();
  if (!query) return;

  const geocoder = new kakao.maps.services.Geocoder();
  geocoder.addressSearch(query, (result, status) => {
    if (status === kakao.maps.services.Status.OK && result.length > 0) {
      renderSearchResults(result);
    } else {
      // fallback: keyword search
      const ps = new kakao.maps.services.Places();
      ps.keywordSearch(query, (result2, status2) => {
        if (status2 === kakao.maps.services.Status.OK && result2.length > 0) {
          renderSearchResults(result2.map(r => ({
            address_name: r.address_name || r.road_address_name || r.place_name,
            x: r.x, y: r.y,
          })));
        } else {
          showToast('검색 결과가 없습니다');
          searchResults.style.display = 'none';
        }
      });
    }
  });
}

function renderSearchResults(items) {
  searchResults.innerHTML = items.slice(0, 8).map((item, i) => {
    const name = item.place_name || item.address_name || item.road_address?.address_name || '';
    const sub = item.road_address?.address_name || item.address?.address_name || '';
    return `<div class="search-result-item" data-idx="${i}">
      <div>${name}</div>
      ${sub && sub !== name ? `<div class="addr">${sub}</div>` : ''}
    </div>`;
  }).join('');
  searchResults.style.display = 'block';

  searchResults.querySelectorAll('.search-result-item').forEach((el, i) => {
    el.addEventListener('click', () => {
      const item = items[i];
      const lat = parseFloat(item.y);
      const lng = parseFloat(item.x);
      if (!isNaN(lat) && !isNaN(lng)) {
        state.map.setCenter(new kakao.maps.LatLng(lat, lng));
        state.map.setLevel(3);
        searchResults.style.display = 'none';
        setTimeout(() => onMapClick(lat, lng), 600);
      }
    });
  });
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
boot();
</script>
